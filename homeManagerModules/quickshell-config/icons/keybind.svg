<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Monochrome keyboard glyph for the keybind popup title. Authored WHITE on
       transparent (like the other ThemeIcon SVGs); ColorOverlay tints it to the
       palette at runtime. -->
  <rect x="2" y="6" width="20" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round">
    <!-- function-ish top row -->
    <rect x="4" y="8.5" width="3.1" height="2.2" rx="0.8"/>
    <rect x="8"  y="8.5" width="3.1" height="2.2" rx="0.8"/>
    <rect x="12" y="8.5" width="3.1" height="2.2" rx="0.8"/>
    <rect x="16" y="8.5" width="3.1" height="2.2" rx="0.8"/>
    <!-- home row -->
    <rect x="4" y="11.7" width="3.1" height="2.2" rx="0.8"/>
    <rect x="8"  y="11.7" width="3.1" height="2.2" rx="0.8"/>
    <rect x="12" y="11.7" width="3.1" height="2.2" rx="0.8"/>
    <rect x="16" y="11.7" width="3.1" height="2.2" rx="0.8"/>
    <!-- space bar -->
    <rect x="7.2" y="14.9" width="9.6" height="2.2" rx="0.8"/>
  </g>
</svg>
